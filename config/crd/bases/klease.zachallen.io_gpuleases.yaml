---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: gpuleases.klease.zachallen.io
spec:
  group: klease.zachallen.io
  names:
    kind: GPULease
    listKind: GPULeaseList
    plural: gpuleases
    shortNames:
    - gl
    singular: gpulease
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.workloadRef.name
      name: Workload
      type: string
    - jsonPath: .spec.duration
      name: Duration
      type: string
    - jsonPath: .status.expiresAt
      name: Expires
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GPULease is the Schema for the gpuleases API. It arbitrates access to a
          shared GPU: workloads labeled klease.zachallen.io/managed="true" obey the
          invariant "no active lease -> replicas 0". At most one lease is Active
          cluster-wide at any moment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GPULease
            properties:
              duration:
                description: |-
                  duration is how long the lease holds the GPU once admitted. The timer
                  starts at admission (status.activeSince), not at creation — a queued
                  lease does not burn its slot waiting.
                type: string
                x-kubernetes-validations:
                - message: duration must be greater than 0 and at most 24h
                  rule: duration(self) > duration('0s') && duration(self) <= duration('24h')
              gracePeriod:
                description: |-
                  gracePeriod is how long the drain may take after expiry before the
                  holder's pods are force-deleted. Defaults to 5m.
                type: string
                x-kubernetes-validations:
                - message: gracePeriod must not be negative
                  rule: duration(self) >= duration('0s')
              workloadRef:
                description: |-
                  workloadRef identifies the workload that holds the GPU while this lease
                  is Active. It must live in the same namespace as the lease.
                properties:
                  kind:
                    description: kind of the workload. Only Deployment is supported
                      in v0.1.
                    enum:
                    - Deployment
                    type: string
                  name:
                    description: name of the workload, in the same namespace as the
                      lease.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
            required:
            - duration
            - workloadRef
            type: object
            x-kubernetes-validations:
            - message: gracePeriod must not exceed duration
              rule: '!has(self.gracePeriod) || duration(self.gracePeriod) <= duration(self.duration)'
          status:
            description: status defines the observed state of GPULease
            properties:
              activeSince:
                description: activeSince is when the lease was admitted (Pending ->
                  Active).
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the GPULease resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              drainDeadline:
                description: |-
                  drainDeadline is expiresAt + spec.gracePeriod, stamped when the lease
                  enters Draining; leftover pods are force-deleted when it is reached.
                format: date-time
                type: string
              expiresAt:
                description: expiresAt is activeSince + spec.duration; drain starts
                  when it is reached.
                format: date-time
                type: string
              queuePosition:
                description: |-
                  queuePosition is the lease's position in the global FIFO queue
                  (0 for the queue head or the Active lease).
                format: int32
                type: integer
              state:
                description: 'state is the current lifecycle phase: Pending, Active,
                  Draining, or Expired.'
                enum:
                - Pending
                - Active
                - Draining
                - Expired
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
