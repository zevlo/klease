# This rule is not used by the project klease itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the klease.zachallen.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: klease
    app.kubernetes.io/managed-by: kustomize
  name: gpulease-editor-role
rules:
- apiGroups:
  - klease.zachallen.io
  resources:
  - gpuleases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - klease.zachallen.io
  resources:
  - gpuleases/status
  verbs:
  - get
